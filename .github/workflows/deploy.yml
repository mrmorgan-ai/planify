name: deploy

# Runs the gates in ci.yml, applies the pending D1 migrations, then publishes —
# in that order, because code that reads a column the database does not have yet
# is a broken deployment. Run from a pull request it publishes a preview against
# the preview database; run from main it publishes production.
#
# Manual for now. To deploy every pull request and every merge to main, restore
# the push and pull_request triggers below. Either way it stays dormant until the
# repository variable DEPLOY_ENABLED is set to 'true'.
on:
  workflow_dispatch:
  workflow_call:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

# A second push to the same branch makes the first deployment pointless.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # Preview URLs are public, so a pull request never touches the real roadmap:
    # the preview environment is bound to its own database.
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_ENV: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Apply pending migrations
        run: npx wrangler d1 migrations apply DB --env "$WRANGLER_ENV" --remote

      - name: Publish
        run: npx wrangler pages deploy dist --project-name planify --branch "$BRANCH"
