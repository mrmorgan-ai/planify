name: prod-deploy

# On every push to main: checks, migrations, then deploy to production.
# Off until the repository variable DEPLOY_ENABLED is 'true'.
on:
  # workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: vars.DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Apply pending migrations
        run: npx wrangler d1 migrations apply DB --env production --remote

      - name: Publish
        run: npx wrangler pages deploy dist --project-name planify --branch main --commit-hash "$GITHUB_SHA"
