name: ci

# Manual by default, plus callable from deploy.yml so the gates are defined once
# and the deploy cannot run without them. To turn automatic runs back on, restore
# the push trigger below.
on:
  workflow_dispatch:
  workflow_call:
  # push:
  #   branches: ['**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
