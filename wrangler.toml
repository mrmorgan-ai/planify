name = "planify"
compatibility_date = "2026-09-01"
pages_build_output_dir = "dist"

# Replace both database_id values with what `wrangler d1 create` printed. Local
# development works with the placeholders: `--local` keys its SQLite file off the
# binding name, not the id.
#
# The two environments are separate databases on purpose. Production is the
# `main` branch of the Pages project; every other branch gets [env.preview],
# including `test`, where test-deploy.yml publishes each push to main before
# prod-deploy.yml takes it to production. So nothing under test can read or write
# the real roadmap. `planify-preview` holds example data and nothing personal.

[[d1_databases]]
binding = "DB"
database_name = "planify"
database_id = "4471b6bd-4ba1-4b23-937e-906d3b536090"
migrations_dir = "migrations"

[[env.production.d1_databases]]
binding = "DB"
database_name = "planify"
database_id = "4471b6bd-4ba1-4b23-937e-906d3b536090"
migrations_dir = "migrations"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "planify-preview"
database_id = "0d0af9d3-1c93-454f-9957-80796774045f"
migrations_dir = "migrations"

# The Access application every API request must carry a token from. Not secret:
# both values appear in the redirect Access sends to anyone not signed in. Pages
# does not inherit `vars` into an environment that overrides another binding, so
# each environment repeats them; without them the API refuses every request.

[vars]
ACCESS_TEAM_DOMAIN = "umbral-app.cloudflareaccess.com"
ACCESS_AUD = "13812ba5f0ac70f3ff835eeff09cbb92d41ff525acd1c75e26107ddd8137df02"

[env.production.vars]
ACCESS_TEAM_DOMAIN = "umbral-app.cloudflareaccess.com"
ACCESS_AUD = "13812ba5f0ac70f3ff835eeff09cbb92d41ff525acd1c75e26107ddd8137df02"

[env.preview.vars]
ACCESS_TEAM_DOMAIN = "umbral-app.cloudflareaccess.com"
ACCESS_AUD = "a136bc894364ba4599a57ccfc5b4af6da0d4e47119e7e59ab81f59480a4fd3e2"
